<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take One English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
/* Idea: cartelera de cine. Cada nivel es un boleto; el héroe es una pantalla con subtítulos. Un solo gesto fuerte (pantalla + boletos), lo demás tranquilo. */
:root{
  --paper:#F2F3F8; --card:#FFFFFF; --ink:#14162B; --muted:#5A5F7A; --line:#D8DBE8;
  --accent:#2B3FE6; --accent-ink:#FFFFFF; --marquee:#E8452C; --gold:#F2B200;
  --good:#12875A; --good-bg:#E2F5EC; --bad:#C4302B; --bad-bg:#FBE6E4;
  --screen:#0B0C18; --screen-ink:#F6F3E6;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1124; --card:#191C38; --ink:#EEF0FB; --muted:#A3A9CC; --line:#2D325C;
    --accent:#8FA0FF; --accent-ink:#0F1124; --marquee:#FF6E58; --gold:#FFC93A;
    --good:#4FD69C; --good-bg:#12362B; --bad:#FF8A84; --bad-bg:#40181A;
    --screen:#05060E; --screen-ink:#F6F3E6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1124; --card:#191C38; --ink:#EEF0FB; --muted:#A3A9CC; --line:#2D325C;
  --accent:#8FA0FF; --accent-ink:#0F1124; --marquee:#FF6E58; --gold:#FFC93A;
  --good:#4FD69C; --good-bg:#12362B; --bad:#FF8A84; --bad-bg:#40181A;
  --screen:#05060E; --screen-ink:#F6F3E6;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(2.2rem,6vw,4.2rem);font-weight:800}
h2{font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:60px}
.logo{font-family:var(--display);font-weight:800;font-size:1.25rem;text-decoration:none;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:26px;height:18px;border-radius:3px;background:repeating-linear-gradient(115deg,var(--ink) 0 6px,var(--gold) 6px 12px)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--paper)}
.stop{display:none;border:0;background:var(--marquee);color:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem;white-space:nowrap}
body.speaking .stop{display:inline-block}

main{padding:34px 0 80px}
section{margin-top:54px}
section>h2{margin-bottom:18px}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:11px 20px;border-radius:999px;font-weight:700;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.say{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:.88rem;font-weight:600}
.say:hover{border-color:var(--accent);color:var(--accent)}
.say.round{padding:8px;border-radius:50%}

/* Héroe */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:34em}
.hero h1 em{font-style:normal;color:var(--marquee)}
.screen{background:var(--screen);color:var(--screen-ink);border-radius:18px;padding:14px;box-shadow:0 24px 50px -24px rgba(11,12,24,.55)}
.screen .frame{border-radius:8px;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:22px;
  background:radial-gradient(120% 90% at 50% 0%,#2a2f6b 0%,#12142e 55%,#07081a 100%);position:relative;overflow:hidden}
.screen .frame::before,.screen .frame::after{content:"";position:absolute;left:0;right:0;height:26px;background:#000}
.screen .frame::before{top:0}.screen .frame::after{bottom:0}
.screen .meta{position:absolute;top:36px;left:22px;right:22px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#aab0dd}
.screen .en{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,3.2vw,2rem);line-height:1.1;text-align:center;text-wrap:balance}
.screen .note{font-size:.92rem;color:#FFD95A;text-align:center;margin-bottom:26px;text-wrap:balance}
.screen .note b,.screen .note i{color:#fff}
.screen .ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 6px 2px;flex-wrap:wrap}
.screen .say{background:transparent;border-color:#4a4f85;color:var(--screen-ink)}
.screen .say:hover{border-color:#FFD95A;color:#FFD95A}
@keyframes sub{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.screen .en,.screen .note{animation:sub .45s ease both}
@media (prefers-reduced-motion:reduce){.screen .en,.screen .note{animation:none}html{scroll-behavior:auto}}

/* Boletos de nivel */
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.ticket{--c:var(--accent);display:flex;background:var(--card);border-radius:var(--r);text-decoration:none;color:var(--ink);position:relative;border:1px solid var(--line);min-height:150px;transition:transform .15s ease}
.ticket:hover{transform:translateY(-3px)}
.ticket .stub{flex:0 0 96px;background:var(--c);color:#fff;border-radius:var(--r) 0 0 var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-right:2px dashed var(--paper)}
.ticket .stub b{font-family:var(--display);font-size:2.3rem;font-weight:800;line-height:1}
.ticket .stub span{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}
.ticket::before,.ticket::after{content:"";position:absolute;left:87px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.ticket::before{top:-10px}.ticket::after{bottom:-10px}
.ticket .body{padding:16px 18px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.ticket .body p{font-size:.92rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.barlabel{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* Tarjetas y listas */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.skill h3{margin:6px 0}
.skill p{color:var(--muted);font-size:.95rem}
.crumb{font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px}
.crumb a{color:var(--muted)}
.lvhead{--c:var(--accent);display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.lvhead .code{font-family:var(--display);font-weight:800;font-size:clamp(4rem,13vw,8rem);line-height:.85;color:var(--c);letter-spacing:-.05em}
.lvhead p{color:var(--muted);max-width:40em;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.86rem}
.prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.prog a{--c:var(--accent);display:grid;grid-template-columns:54px 1fr auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);padding:14px 18px;text-decoration:none;color:var(--ink)}
.prog a:hover{border-color:var(--c)}
.prog .n{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.prog small{display:block;color:var(--muted);font-size:.88rem}
.pill{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.lv{color:#fff;border-color:transparent;background:var(--c,var(--accent))}

/* Lección */
.lesson{max-width:780px}
.exp p{margin-bottom:12px;max-width:65ch}
.exp b{color:var(--accent)}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.exlist li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:10px;background:var(--paper)}
.exlist .en{font-weight:600}
.exlist .es{color:var(--muted);font-size:.92rem}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.vocab div{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.vocab b{font-weight:600}
.vocab span{grid-column:1/-1;color:var(--muted);font-size:.9rem}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:30px}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:14px}
.q{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0;background:var(--card);display:flex;flex-direction:column;gap:10px;min-width:0}
.q .legend{font-weight:600}
.q .qn{font-family:var(--mono);color:var(--muted);font-size:.8rem;margin-right:6px}
.q.ok{border-color:var(--good)}.q.ko{border-color:var(--bad)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;text-align:left}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.opt[disabled]{cursor:default}
.why{font-size:.92rem;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px}
.submit,.result{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-radius:var(--r);padding:16px 18px;border:1px dashed var(--line)}
.result{border-style:solid}
.result.pass{background:var(--good-bg);border-color:var(--good)}
.result.fail{background:var(--bad-bg);border-color:var(--bad)}
.result .big{font-family:var(--display);font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.result>div{flex:1;min-width:180px}

/* Escena */
.script{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.script li{display:grid;grid-template-columns:90px 1fr;gap:12px}
.script b{font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--marquee);padding-top:4px}
details{border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;background:var(--card)}
summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:12px}
.pre{white-space:pre-wrap;font-family:var(--body)}

/* Speaking */
.sp{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.sp-t{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.2}
.sp-t .hit{color:var(--good)}.sp-t .miss{color:var(--bad);text-decoration:underline wavy}
.sp-t.hidden{filter:blur(7px);user-select:none}
.sp-out{font-family:var(--mono);font-size:.88rem;color:var(--muted);min-height:1.3em}
.sp-score{font-weight:700}
.mic{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--marquee);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:.9rem}
.mic.on{background:var(--ink);color:var(--paper);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.nomic{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:220px}
.nomic input{flex:1;min-width:160px}
body.has-mic .nomic{display:none}
body:not(.has-mic) .mic{display:none}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{min-height:170px;resize:vertical;line-height:1.5}
.timer{font-family:var(--mono);font-size:1.4rem;font-variant-numeric:tabular-nums}

/* TOEFL */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0}
.tabs button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:600}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#14162B}
table{border-collapse:collapse;width:100%}
.tablewrap{overflow-x:auto}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td.num{font-family:var(--display);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctw{line-height:2.3;max-width:70ch}
.ctw .gap{white-space:nowrap}
.ctw input{width:auto;display:inline-block;padding:2px 6px;font-family:var(--mono);font-size:.95rem;border-radius:6px;margin-left:1px}
.ctw input.ok{border-color:var(--good);background:var(--good-bg)}
.ctw input.ko{border-color:var(--bad);background:var(--bad-bg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border:1.5px dashed var(--line);border-radius:10px}
.pool.ans{border-style:solid;background:var(--paper)}
.pool.ok{border-color:var(--good);background:var(--good-bg)}.pool.ko{border-color:var(--bad)}
.word{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;font-weight:600}
.post{border-left:4px solid var(--accent);padding:6px 14px;background:var(--paper);border-radius:0 10px 10px 0}
.post b{display:block;font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.hint{font-size:.9rem;color:var(--muted)}
.quote{display:flex;flex-direction:column;gap:8px}
.quote .q-en{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.15}
.quote .src{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.steps li{counter-increment:s;border-top:4px solid var(--marquee);padding-top:10px;font-size:.95rem}
.steps li::before{content:"Paso " counter(s);display:block;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.steps b{display:block;font-family:var(--display);font-size:1.1rem}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:.88rem}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .lvhead{grid-template-columns:1fr;gap:6px}
  .prog a{grid-template-columns:36px 1fr}
  .prog a .pill{grid-column:2;justify-self:start}
  .script li{grid-template-columns:1fr;gap:0}
  .top .wrap{gap:10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#inicio"><i></i>Take One</a>
    <nav class="nav" aria-label="Secciones">
      <a href="#inicio" data-nav="inicio">Inicio</a>
      <a href="#a1" data-nav="a1">A1</a>
      <a href="#a2" data-nav="a2">A2</a>
      <a href="#b1" data-nav="b1">B1</a>
      <a href="#b2" data-nav="b2">B2</a>
      <a href="#c1" data-nav="c1">C1</a>
      <a href="#c2" data-nav="c2">C2</a>
      <a href="#toefl" data-nav="toefl">TOEFL</a>
      <a href="#cine" data-nav="cine">Cine</a>
      <a href="#frases" data-nav="frases">Frases</a>
      <a href="#nivelacion" data-nav="nivelacion">Prueba de nivel</a>
    </nav>
    <button class="stop" id="stop" data-act="stop" type="button">Detener audio</button>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">Take One English. Curso A1 a C2 y preparación TOEFL. Tu avance se guarda solo en este navegador.</div></footer>
<script src="data-levels.js" charset="utf-8"></script>
<script src="data-extra.js" charset="utf-8"></script>
<script src="app.js" charset="utf-8"></script>
</body>
</html>
