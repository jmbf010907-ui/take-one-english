<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take One English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
/* Plan de diseño
   Mundo: una función nocturna de cine. El fondo es la sala (índigo profundo con haces de proyector);
   lo que se estudia va sobre hojas claras, como el programa de mano. Un solo gesto fuerte: la pantalla con marquesina de focos.
   Color: noche #191A47, hoja #F6F4FD, tinta #15163A, foco amarillo #FFC531, telón tomate #F0503A, lila #B8BBF0.
   Tipo: Bricolage Grotesque para títulos, Instrument Sans para texto. Sin mayúsculas forzadas ni monoespaciada.
   Alineación a la izquierda; aire generoso entre bloques. */
:root{
  color-scheme:dark;
  --night:#191A47; --night-2:#23256B; --sheet:#F6F4FD; --yellow:#FFC531; --tomato:#F0503A; --lilac:#B8BBF0;
  --ink:#F6F4FD; --muted:#B8BBF0; --line:#3B3E86; --card:#23256B; --well:#23256B;
  --accent:#FFC531; --accent-ink:#15163A;
  --good:#0F7F54; --good-bg:#DFF4EA; --bad:#C0302B; --bad-bg:#FBE5E3;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
/* Contexto claro: hojas, boletos y tarjetas */
.sheet,.ticket,.card,.prog a{
  color-scheme:light;
  --ink:#15163A; --muted:#5B5E86; --line:#DAD8EC; --card:#FFFFFF; --well:#EEECFA;
  --accent:#3A3FD8; --accent-ink:#FFFFFF;
  color:var(--ink);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
body::before{content:"";position:absolute;inset:0 0 auto 0;height:1100px;pointer-events:none;z-index:0;
  background:
   conic-gradient(from 196deg at 88% -6%,transparent 0 16deg,rgba(255,197,49,.13) 16deg 30deg,transparent 30deg 39deg,rgba(184,187,240,.10) 39deg 49deg,transparent 49deg),
   radial-gradient(60% 50% at 12% 0%,rgba(240,80,58,.16),transparent 70%);
  -webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
body::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.6px) 0 0/24px 24px}
header,main,footer{position:relative;z-index:1}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(2.3rem,6vw,4.4rem);font-weight:800;line-height:1.06}
h2{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:700;line-height:1.15}
h3{font-size:1.2rem;font-weight:700;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tomato);outline-offset:3px}
.kicker{font-size:.9rem;font-weight:600;color:var(--muted)}
.hint{font-size:.95rem;color:var(--muted);max-width:66ch}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.between{justify-content:space-between}

/* Barra superior */
.top{position:sticky;top:0;z-index:20;background:rgba(25,26,71,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px}
.logo{font-family:var(--display);font-weight:800;font-size:1.3rem;text-decoration:none;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:10px}
.logo i{display:inline-block;width:28px;height:19px;border-radius:3px;background:repeating-linear-gradient(115deg,var(--sheet) 0 6px,var(--night) 6px 12px);border:2px solid var(--sheet)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 13px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--yellow);color:#15163A}
.stop{display:none;border:0;background:var(--tomato);color:#fff;border-radius:999px;padding:8px 15px;font-weight:600;font-size:.86rem;white-space:nowrap}
body.speaking .stop{display:inline-block}

main{padding:48px 0 96px}
main section{margin-top:72px}
main section>h2{margin-bottom:22px}
.sheet section{margin-top:44px}
.sheet section>h2{margin-bottom:16px;font-size:1.45rem}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--yellow);background:var(--yellow);color:#15163A;padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;line-height:1.2}
.btn:hover{background:#FFD45E;border-color:#FFD45E}
.btn.ghost{background:transparent;color:var(--ink);border-color:currentColor}
.btn.ghost:hover{background:transparent;border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.say{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:.9rem;font-weight:600;line-height:1.2}
.say:hover{border-color:var(--accent);color:var(--accent)}
.say.round{padding:9px;border-radius:50%;flex:none}

/* Héroe */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.hero .lead{font-size:1.15rem;color:var(--muted);max-width:33em}
.hero .stack{gap:26px}
.screen{padding:18px;border-radius:22px;background-color:#0A0B22;
  background-image:radial-gradient(circle at center,var(--yellow) 2.6px,rgba(255,197,49,.25) 3.2px,transparent 4.6px);background-size:22px 22px;background-repeat:round;
  box-shadow:0 30px 70px -30px #000,0 0 60px -10px rgba(255,197,49,.28)}
.screen-in{background:#0A0B22;border-radius:8px;overflow:hidden}
.frame{display:grid;grid-template-rows:auto 1fr auto;gap:18px;min-height:280px;padding:18px 24px 22px;color:#F6F4FD;
  border-block:20px solid #000;background:radial-gradient(120% 90% at 50% 0%,#34388F 0%,#191A47 55%,#0D0E2C 100%)}
.frame .meta{display:flex;justify-content:space-between;gap:12px;font-size:.84rem;font-weight:600;color:#B8BBF0}
.frame .en{align-self:center;font-family:var(--display);font-weight:700;font-size:clamp(1.45rem,3vw,2.05rem);line-height:1.18;text-align:center;text-wrap:balance}
.frame .note{font-size:.95rem;line-height:1.5;color:var(--yellow);text-align:center;text-wrap:balance}
.frame .note b,.frame .note i{color:#fff}
.screen .ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 10px;flex-wrap:wrap}
.screen .say{background:transparent;border-color:#4A4E96;color:#F6F4FD}
.screen .say:hover{border-color:var(--yellow);color:var(--yellow)}
@keyframes sub{from{opacity:0}to{opacity:1}}
.frame .en,.frame .note{animation:sub .35s ease both}
@media (prefers-reduced-motion:reduce){.frame .en,.frame .note{animation:none}html{scroll-behavior:auto}}

/* Boletos de nivel */
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.ticket{--c:#3A3FD8;display:flex;background:var(--sheet);border-radius:var(--r);text-decoration:none;position:relative;min-height:164px}
.ticket:hover .stub{filter:brightness(1.08)}
.ticket .stub{flex:0 0 108px;background:var(--c);color:#fff;border-radius:var(--r) 0 0 var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-right:2px dashed var(--sheet);padding:10px 6px;text-align:center}
.ticket .stub b{font-family:var(--display);font-size:2.4rem;font-weight:800;line-height:1}
.ticket .stub span{font-size:.76rem;font-weight:600;line-height:1.2}
.ticket::before,.ticket::after{content:"";position:absolute;left:98px;width:20px;height:20px;border-radius:50%;background:var(--night)}
.ticket::before{top:-10px}.ticket::after{bottom:-10px}
.ticket .body{padding:20px 22px;display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.ticket .body p{font-size:.94rem;line-height:1.5;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.barlabel{display:flex;justify-content:space-between;gap:12px;font-size:.84rem;font-weight:600;color:var(--muted);margin-top:auto}

/* Bloques */
.sheet{background:var(--sheet);border-radius:24px;padding:clamp(22px,4.5vw,52px)}
.card{background:var(--sheet);border-radius:var(--r);padding:26px}
.sheet .card{background:var(--card);border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:34px 40px}
.cols h3{margin-bottom:8px;padding-top:14px;border-top:3px solid var(--yellow)}
.cols p{color:var(--muted);font-size:.98rem}
.crumb{font-size:.88rem;color:var(--muted)}
.crumb a{color:var(--muted)}
.lvhead{--c:var(--yellow);display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center}
.lvhead .code{font-family:var(--display);font-weight:800;font-size:clamp(4.5rem,14vw,9rem);line-height:.9;color:var(--c);letter-spacing:-.05em;filter:brightness(1.25) saturate(1.1)}
.lvhead .stack{gap:12px}
.lvhead p{color:var(--muted);max-width:40em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.88rem;line-height:1.3}
.prog{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
.prog a{--c:#3A3FD8;display:grid;grid-template-columns:44px 1fr auto;gap:18px;align-items:center;background:var(--sheet);border-left:8px solid var(--c);border-radius:var(--r);padding:16px 22px;text-decoration:none}
.prog a:hover{background:#fff}
.prog .n{font-family:var(--display);font-weight:700;color:var(--muted);font-size:1.1rem;font-variant-numeric:tabular-nums}
.prog b{display:block;line-height:1.3}
.prog small{display:block;color:var(--muted);font-size:.9rem;line-height:1.4;margin-top:2px}
.pill{font-size:.8rem;font-weight:600;border-radius:999px;padding:5px 12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;line-height:1.2}
.pill.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.lv{color:#fff;border-color:transparent;background:var(--c,var(--accent))}

/* Lección */
.lesson{max-width:860px}
.lesson>h1{font-size:clamp(1.9rem,5vw,3.1rem)}
.exp p{max-width:65ch}
.exp p+p{margin-top:14px}
.exp b{color:var(--accent)}
.exlist{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
.exlist li{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 18px;border-radius:12px;background:var(--well)}
.exlist .en{font-weight:600;line-height:1.4}
.exlist .es{color:var(--muted);font-size:.94rem;line-height:1.45;margin-top:2px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.vocab div{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card)}
.vocab b{font-weight:600;line-height:1.35}
.vocab span{grid-column:1/-1;color:var(--muted);font-size:.93rem;line-height:1.45}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:44px;padding-top:26px;border-top:1px solid var(--line)}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.q{border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;background:var(--card);display:flex;flex-direction:column;gap:14px;min-width:0}
.q .legend{font-weight:600;line-height:1.45}
.q .qn{font-family:var(--display);color:var(--muted);margin-right:10px;font-variant-numeric:tabular-nums}
.q.ok{border-color:var(--good)}.q.ko{border-color:var(--bad)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--well);color:var(--ink);border-radius:10px;padding:10px 16px;text-align:left;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.opt[disabled]{cursor:default}
.why{font-size:.94rem;line-height:1.5;color:var(--muted);border-left:3px solid var(--yellow);padding-left:12px}
.submit,.result{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-radius:var(--r);padding:18px 22px;border:1px dashed var(--line)}
.result{border-style:solid}
.result.pass{background:var(--good-bg);border-color:var(--good)}
.result.fail{background:var(--bad-bg);border-color:var(--bad)}
.result .big{font-family:var(--display);font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.result>div{flex:1;min-width:190px;line-height:1.45}

/* Escena */
.script{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
.script li{display:grid;grid-template-columns:96px 1fr;gap:14px;line-height:1.5}
.script b{font-size:.88rem;color:var(--tomato);padding-top:2px}
details{border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;background:var(--card)}
summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:14px}
.pre{white-space:pre-wrap;font-family:var(--body)}

/* Speaking */
.sp{border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;background:var(--card);display:flex;flex-direction:column;gap:14px}
.sp-t{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.35}
.sp-t .hit{color:var(--good)}.sp-t .miss{color:var(--bad);text-decoration:underline wavy}
.sp-t.hidden{filter:blur(7px);user-select:none}
.sp-out{font-size:.92rem;color:var(--muted);line-height:1.45}
.sp-out:empty,.sp-score:empty{display:none}
.sp-score{font-weight:700;line-height:1.4}
.mic{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--tomato);color:#fff;border-radius:999px;padding:9px 17px;font-weight:700;font-size:.9rem;line-height:1.2}
.mic.on{background:var(--ink);color:var(--card);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.nomic{display:flex;gap:10px;flex-wrap:wrap;flex:1 1 100%}
.nomic input{flex:1;min-width:180px}
body.has-mic .nomic{display:none}
body:not(.has-mic) .mic{display:none}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--well);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;width:100%}
textarea{min-height:180px;resize:vertical;line-height:1.55}
.timer{font-family:var(--display);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums}

/* Videos */
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
.vid{margin:0;display:flex;flex-direction:column;gap:14px}
.vid-frame{display:grid;place-items:center;aspect-ratio:16/9;width:100%;border:0;border-radius:14px;overflow:hidden;padding:0;text-decoration:none;
  background:#0A0B22 center/cover no-repeat;position:relative;box-shadow:0 18px 40px -22px #000}
.vid-frame::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(52,56,143,.55),rgba(10,11,34,.65))}
.vid-frame .playbtn{position:relative;width:66px;height:66px;border-radius:50%;background:var(--yellow);color:#15163A;display:grid;place-items:center}
.vid-frame:hover .playbtn{background:#fff}
.vid-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid figcaption{display:flex;flex-direction:column;gap:6px}
.vid figcaption b{font-family:var(--display);font-size:1.1rem;line-height:1.3}
.vid figcaption span{font-size:.88rem;color:var(--muted)}
.vid figcaption p{font-size:.95rem;line-height:1.5}
.vid figcaption a{font-size:.9rem;font-weight:600}

/* TOEFL */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:30px 0 26px}
.tabs button{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:9px 18px;font-weight:600;line-height:1.2}
.tabs button.on{background:var(--yellow);border-color:var(--yellow);color:#15163A}
table{border-collapse:collapse;width:100%}
.tablewrap{overflow-x:auto}
th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
tr:last-child td{border-bottom:0}
th{font-size:.85rem;color:var(--muted);font-weight:600}
td.num{font-family:var(--display);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctw{line-height:2.5;max-width:70ch}
.ctw .gap{white-space:nowrap}
.ctw input{width:auto;display:inline-block;padding:3px 7px;font-size:.98rem;border-radius:6px;margin-left:1px}
.ctw input.ok{border-color:var(--good);background:var(--good-bg)}
.ctw input.ko{border-color:var(--bad);background:var(--bad-bg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:1.5px dashed var(--line);border-radius:12px}
.pool.ans{border-style:solid;background:var(--well)}
.pool.ok{border-color:var(--good);background:var(--good-bg)}.pool.ko{border-color:var(--bad)}
.word{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;font-weight:600;line-height:1.2}
.post{border-left:4px solid var(--accent);padding:10px 16px;background:var(--well);border-radius:0 12px 12px 0;line-height:1.5}
.post b{display:block;font-size:.86rem;color:var(--muted);margin-bottom:2px}
.checks{padding-left:1.2em;color:var(--muted);font-size:.95rem;display:flex;flex-direction:column;gap:4px}
.quote{display:flex;flex-direction:column;gap:14px}
.quote .q-en{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.25}
.quote .src{font-size:.88rem;font-weight:600;color:var(--muted)}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:30px 28px}
.steps li{counter-increment:s;border-top:3px solid var(--tomato);padding-top:14px;font-size:.96rem;line-height:1.5;color:var(--muted)}
.steps li::before{content:counter(s);display:block;font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;color:var(--ink);margin-bottom:8px}
.steps b{display:block;font-family:var(--display);font-size:1.12rem;line-height:1.3;color:var(--ink);margin-bottom:4px}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:.9rem}

@media (max-width:820px){
  body{font-size:16.5px}
  main{padding:32px 0 72px}
  main section{margin-top:56px}
  .hero{grid-template-columns:1fr;gap:36px}
  .lvhead{grid-template-columns:1fr;gap:10px}
  .prog a{grid-template-columns:34px 1fr;gap:6px 14px;padding:16px 18px}
  .prog a .pill{grid-column:2;justify-self:start;margin-top:4px}
  .script li{grid-template-columns:1fr;gap:2px}
  .top .wrap{gap:12px}
  .tickets{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#inicio"><i></i>Take One</a>
    <nav class="nav" aria-label="Secciones">
      <a href="#inicio" data-nav="inicio">Inicio</a>
      <a href="#a1" data-nav="a1">A1</a>
      <a href="#a2" data-nav="a2">A2</a>
      <a href="#b1" data-nav="b1">B1</a>
      <a href="#b2" data-nav="b2">B2</a>
      <a href="#c1" data-nav="c1">C1</a>
      <a href="#c2" data-nav="c2">C2</a>
